[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trama-core"
version = "0.1.0"
description = "Índice local reconstruible de notas"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
trama = "trama_core.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"trama_core.ui" = ["style.css"]
